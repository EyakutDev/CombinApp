name: combin_app
description: "Dijital gardırop ve kombin planlama uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigasyon
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.4

  # Görsel İşleme
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  flutter_image_compress: ^2.3.0

  # Hava Durumu
  http: ^1.4.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Dependency Injection
  get_it: ^8.0.3

  # Utility
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
